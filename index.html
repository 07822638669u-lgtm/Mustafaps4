<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستاذ مصطفى محمد | PS4 Host</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #090d16;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .math-glow {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.12);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <div class="fixed top-10 right-10 text-gray-800/20 text-7xl font-mono select-none pointer-events-none">
        ∫ f(x)dx
    </div>

    <header class="max-w-4xl mx-auto w-full flex flex-col md:flex-row justify-between items-center border-b border-blue-900/40 pb-5 mb-6 backdrop-blur-sm">
                <div class="flex items-center space-x-4 space-x-reverse mb-4 md:mb-0">
            <!-- حاوية الصورة الشخصية -->
            <div class="relative">
                <img src="1782586638641.png" alt="الاستاذ مصطفى محمد" class="w-16 h-16 rounded-2xl object-cover border-2 border-blue-500/50 shadow-lg shadow-blue-500/20">
                <span class="absolute bottom-0 left-0 w-4 h-4 bg-green-500 border-2 border-gray-900 rounded-full"></span>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white tracking-wide">الاستاذ مصطفى محمد</h1>
                <p class="text-xs text-blue-400 font-mono mt-0.5">PS4 Exploit Host</p>
            </div>
        </div>

                <h1 class="text-2xl font-bold text-white tracking-wide">الاستاذ مصطفى محمد</h1>
                <p class="text-xs text-blue-400 font-mono mt-0.5">PS4 Exploit Host</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-2 space-x-reverse bg-gray-900/80 border border-blue-500/20 px-4 py-2 rounded-xl text-xs">
            <span class="text-blue-400 font-mono">Status:</span>
            <span class="text-green-400 font-semibold">Ready</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-grow flex flex-col gap-6 relative z-10">
        <section class="bg-gray-900/80 border border-blue-500/20 rounded-2xl p-6 math-glow backdrop-blur-md">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
                    <span id="msgs" class="text-sm font-medium text-gray-200">Loading lapse chain...</span>
                </div>
                <span id="progress-percent" class="text-sm font-mono text-blue-400 font-bold">0%</span>
            </div>
            
            <div class="w-full bg-gray-950 rounded-full h-3 overflow-hidden border border-gray-800 p-0.5">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-600 to-indigo-500 h-full w-0 transition-all duration-300 rounded-full"></div>
            </div>
        </section>

        <section class="bg-black/70 border border-gray-800 rounded-2xl p-5 flex-grow font-mono text-xs backdrop-blur-sm">
            <div class="text-gray-400 mb-3 border-b border-gray-800/80 pb-2 flex justify-between items-center">
                <span>سجل التنفيذ (Execution Log)</span>
            </div>
            <div id="log-output" class="space-y-1.5 h-48 overflow-y-auto text-blue-300">
                <p class="text-gray-500">[System] Initializing host environment for Prof. Mustafa Muhammad...</p>
            </div>
        </section>
    </main>

    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-gray-500 border-t border-gray-800/60 pt-4 mt-6">
        <p>تصميم وتطوير <span class="text-blue-400 font-semibold">الاستاذ مصطفى محمد</span></p>
    </footer>

    <!-- استدعاء ملف السكربت المشغل -->
    <script src="lapse.js"></script>
</body>
</html>
